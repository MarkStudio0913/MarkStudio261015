name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并附加产物的标签（如 v1.0.0）'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

# 打标签（或手动触发）时，在 Windows / Linux 上分别用 electron-builder 打包，
# 并把安装包附加到对应 tag 的 GitHub Release。
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动触发时按输入 tag 检出；push tag 时用默认 ref
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Build packages
        env:
          # 无 FUSE 的 CI 环境下构建 AppImage 需解包运行
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # 不签名（本项目未配置代码签名证书）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.cmd }}

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
